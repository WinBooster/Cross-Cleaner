name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version number (e.g., 2.0.2.4)"
        required: true
        default: "2.0.2.5"

env:
  CARGO_TERM_COLOR: always
  APP_VERSION: ${{ github.event.inputs.version }}

jobs:
  formating_code:
    runs-on: ubuntu-latest
    permissions: write-all
    name: Formating code
    steps:
      - uses: actions/checkout@v4
      - name: Update Cargo.toml version
        run: |
          CARGO_VERSION=$(echo "${{ env.APP_VERSION }}" | cut -d. -f1-3)
          # fallback: keep original if cut fails
          if [ -z "$CARGO_VERSION" ]; then CARGO_VERSION="${{ env.APP_VERSION }}"; fi
          echo "APP_VERSION=${{ env.APP_VERSION }} -> CARGO_VERSION=$CARGO_VERSION"
          # Validate semver (cargo will reject 4 parts like 2.0.3.8)
          if ! echo "$CARGO_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'; then
            echo "ERROR: CARGO_VERSION $CARGO_VERSION is not valid semver"
            exit 1
          fi
          find . -name Cargo.toml -exec sed -i "s/^version = .*/version = \"$CARGO_VERSION\"/" {} +
          echo "Updated Cargo.toml files to $CARGO_VERSION:"
          grep -r "^version = " --include="Cargo.toml" .
      - name: Formating code
        run: cargo fmt
      - name: Commit changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add .
          # Conventional Commits: these messages end up in the release notes, so
          # a plain "Auto format code" would land in the changelog unformatted.
          git commit -m "chore: apply rustfmt" || echo "No changes to commit"
          git push || echo "No changes to push"

  sort_json:
    runs-on: ubuntu-latest
    name: Sorting json
    permissions: write-all
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sort JSON files by program field
        run: |
          sudo apt-get -y install jq

          JSON_FILES=("crates/database/linux_database.json" "crates/database/windows_database.json" "crates/database/registry_database.json" "crates/database/macos_database.json" "crates/database/android_database.json")
          for JSON_FILE in "${JSON_FILES[@]}"; do
            echo "Processing $JSON_FILE..."

            if [ ! -f "$JSON_FILE" ]; then
              echo "Error: JSON file not found at $JSON_FILE"
              exit 1
            fi

            jq 'sort_by(.program | ascii_downcase)' "$JSON_FILE" > "${JSON_FILE}.tmp"

            if [ $? -eq 0 ]; then
              mv "${JSON_FILE}.tmp" "$JSON_FILE"
              echo "Successfully sorted $JSON_FILE"
            else
              echo "Error: Failed to sort $JSON_FILE"
              exit 1
            fi
          done

          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add "${JSON_FILES[@]}"
          git commit -m "chore(database): sort programs by name" || echo "No changes to commit"
          git push || echo "No changes to push"

  upload_databases:
    needs: [sort_json]
    runs-on: ubuntu-latest
    name: Archive databases
    permissions: write-all

    steps:
      - uses: actions/checkout@v4
      - name: Move databases
        run: |
          mv crates/database/linux_database.json linux_database.json
          mv crates/database/windows_database.json windows_database.json
          mv crates/database/registry_database.json registry_database.json
          mv crates/database/macos_database.json macos_database.json
          mv crates/database/android_database.json android_database.json
      - name: Upload databases to artifacts
        uses: actions/upload-artifact@v4
        with:
          name: databases
          path: |
            linux_database.json
            windows_database.json
            registry_database.json
            macos_database.json
            android_database.json

  build_linux:
    runs-on: ubuntu-latest
    needs: [sort_json]
    permissions: write-all
    name: Build Linux
    steps:
      - uses: actions/checkout@v4
      - name: Install ALSA dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev
      - name: Build linux
        run: |
          cargo +nightly build --release -p desktop
          cargo +nightly build --release -p tui
          cargo +nightly build --release -p cli
      - name: Move linux binaries
        run: |
          mv target/release/desktop Linux-Cross_Cleaner_GUI
          mv target/release/tui Linux-Cross_Cleaner_TUI
          mv target/release/cli Linux-Cross_Cleaner_CLI
      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-binaries
          path: |
            Linux-Cross_Cleaner_GUI
            Linux-Cross_Cleaner_TUI
            Linux-Cross_Cleaner_CLI
  build_linux_arm64:
    # Native arm64 runner, so the build is the same job as `build_linux` on a
    # different CPU rather than a cross-compile. The asset names carry `-Arm64`
    # because `database::version` resolves the update asset per architecture.
    runs-on: ubuntu-24.04-arm
    needs: [sort_json]
    permissions: write-all
    name: Build Linux Arm64
    steps:
      - uses: actions/checkout@v4
      - name: Install ALSA dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev
      - name: Build linux arm64
        run: |
          cargo +nightly build --release -p desktop
          cargo +nightly build --release -p tui
          cargo +nightly build --release -p cli
      - name: Move linux arm64 binaries
        run: |
          mv target/release/desktop Linux-Arm64-Cross_Cleaner_GUI
          mv target/release/tui Linux-Arm64-Cross_Cleaner_TUI
          mv target/release/cli Linux-Arm64-Cross_Cleaner_CLI
      - name: Upload Linux Arm64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-binaries-arm64
          path: |
            Linux-Arm64-Cross_Cleaner_GUI
            Linux-Arm64-Cross_Cleaner_TUI
            Linux-Arm64-Cross_Cleaner_CLI
  build_linux_packages:
    # Distribution packages for Linux, published next to the portable binaries.
    #
    # Two deliberate differences from `build_linux`:
    #
    # 1. `self-update` is compiled OUT. Both crates document why in their
    #    Cargo.toml: a package-manager install owns its version, so the app
    #    must neither advertise a newer release nor replace the file dpkg or
    #    AppImage put on disk. Building these packages with the default
    #    features would ship something that fights its own package manager.
    # 2. The binaries land as `cross-cleaner` and `cross-cleaner-tui`, not as
    #    `Linux-Cross_Cleaner_GUI`, because a desktop entry's Exec line and a
    #    symlink in /usr/bin need a name that does not change every release.
    #
    # Everything generated lands under target/pkg, which is gitignored. The
    # sibling `formating_code` job runs `git add .` and pushes, so build output
    # anywhere else would end up committed.
    #
    # The packaging itself is a composite action shared with the arm64 job, so
    # the two cannot drift apart.
    runs-on: ubuntu-24.04
    needs: [sort_json]
    permissions: write-all
    name: Build Linux packages x64 (.deb, .AppImage)
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev

      - name: Build binaries without self-update
        run: cargo +nightly build --release -p desktop --no-default-features
      - name: Build terminal binary without self-update
        run: cargo +nightly build --release -p tui --no-default-features

      - name: Package
        uses: ./.github/actions/linux-package
        with:
          arch: x86_64
          artifact-name: linux-packages
          app-version: ${{ env.APP_VERSION }}

  build_linux_packages_arm64:
    # Native arm64 runner, so this is the same job as `build_linux_packages` on a
    # different CPU rather than a cross-compile. There is no cross-compiled .deb:
    # dpkg and AppImage both encode the target architecture in the artifact, so
    # the payload has to be built for it.
    runs-on: ubuntu-24.04-arm
    needs: [sort_json]
    permissions: write-all
    name: Build Linux packages arm64 (.deb, .AppImage)
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev

      - name: Build binaries without self-update
        run: cargo +nightly build --release -p desktop --no-default-features
      - name: Build terminal binary without self-update
        run: cargo +nightly build --release -p tui --no-default-features

      - name: Package
        uses: ./.github/actions/linux-package
        with:
          arch: aarch64
          artifact-name: linux-packages-arm64
          app-version: ${{ env.APP_VERSION }}

  build_windows:
    runs-on: windows-latest
    needs: [sort_json]
    permissions: write-all
    name: Build Windows
    steps:
      - uses: actions/checkout@v4
      - name: Build windows
        run: |
          cargo +nightly build --release -p desktop
          cargo +nightly build --release -p tui
          cargo +nightly build --release -p cli
      - name: Move windows binaries
        run: |
          copy target\release\desktop.exe Windows-Cross_Cleaner_GUI.exe
          copy target\release\tui.exe Windows-Cross_Cleaner_TUI.exe
          copy target\release\cli.exe Windows-Cross_Cleaner_CLI.exe
      - name: Update installer version
        shell: pwsh
        run: |
          (Get-Content build_setup.iss) -replace '#define MyAppVersion ".*"', '#define MyAppVersion "${{ env.APP_VERSION }}"' | Set-Content build_setup.iss
      - name: Build installer (Inno Setup)
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.9
        with:
          path: build_setup.iss
          # Default x64 branch of build_setup.iss. The architecture is a script
          # parameter so the arm64 job can reuse this file; see the arm64 job.
          options: |
            /DMyArch=x64
      - name: Upload Windows setup artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-setup
          if-no-files-found: error
          path: |
            innosetup\compiler\Cross_Cleaner_Setup.exe
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: |
            Windows-Cross_Cleaner_GUI.exe
            Windows-Cross_Cleaner_TUI.exe
            Windows-Cross_Cleaner_CLI.exe
  build_windows_arm64:
    # Native arm64 runner, so no cross-linker is involved. The installer is named
    # `..._Arm64.exe`, which keeps it out of the winget match on the x64 name.
    runs-on: windows-11-arm
    needs: [sort_json]
    permissions: write-all
    name: Build Windows Arm64
    steps:
      - uses: actions/checkout@v4
      - name: Build windows arm64
        run: |
          cargo +nightly build --release -p desktop
          cargo +nightly build --release -p tui
          cargo +nightly build --release -p cli
      - name: Move windows arm64 binaries
        run: |
          copy target\release\desktop.exe Windows-Arm64-Cross_Cleaner_GUI.exe
          copy target\release\tui.exe Windows-Arm64-Cross_Cleaner_TUI.exe
          copy target\release\cli.exe Windows-Arm64-Cross_Cleaner_CLI.exe
      - name: Update installer version
        shell: pwsh
        run: |
          (Get-Content build_setup.iss) -replace '#define MyAppVersion ".*"', '#define MyAppVersion "${{ env.APP_VERSION }}"' | Set-Content build_setup.iss
      - name: Build installer (Inno Setup, arm64)
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.9
        with:
          path: build_setup.iss
          # Selects the arm64 branch of build_setup.iss: ArchitecturesAllowed=arm64
          # and the `_Arm64` output name.
          options: |
            /DMyArch=arm64
      - name: Upload Windows Arm64 setup artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-setup-arm64
          if-no-files-found: error
          path: |
            innosetup\compiler\Cross_Cleaner_Setup_Arm64.exe
      - name: Upload Windows Arm64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-binaries-arm64
          if-no-files-found: error
          path: |
            Windows-Arm64-Cross_Cleaner_GUI.exe
            Windows-Arm64-Cross_Cleaner_TUI.exe
            Windows-Arm64-Cross_Cleaner_CLI.exe
  build_macos_arm64:
    runs-on: macos-latest
    needs: [sort_json]
    permissions: write-all
    name: Build MacOS Arm64
    steps:
      - uses: actions/checkout@v4
      - name: Build macos
        run: |
          cargo +nightly build --release -p desktop
          cargo +nightly build --release -p tui
          cargo +nightly build --release -p cli
      - name: Move macos binaries
        run: |
          mv target/release/desktop MacOS-Arm64-Cross_Cleaner_GUI
          mv target/release/tui MacOS-Arm64-Cross_Cleaner_TUI
          mv target/release/cli MacOS-Arm64-Cross_Cleaner_CLI
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-binaries-arm64
          path: |
            MacOS-Arm64-Cross_Cleaner_GUI
            MacOS-Arm64-Cross_Cleaner_TUI
            MacOS-Arm64-Cross_Cleaner_CLI
  build_android:
    runs-on: ubuntu-latest
    needs: [sort_json]
    permissions: write-all
    name: Build Android APK
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
      - name: Install cargo-apk2
        run: cargo install cargo-apk2 --locked
      - name: Install Android targets
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android i686-linux-android
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973"
      - name: Generate release keystore
        run: |
          keytool -genkey -v -keystore crates/android/release.keystore -storepass android -alias androidreleasekey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Release,O=Android,C=US"
          echo "CARGO_APK_RELEASE_KEYSTORE=$GITHUB_WORKSPACE/crates/android/release.keystore" >> $GITHUB_ENV
          echo "CARGO_APK_RELEASE_KEYSTORE_PASSWORD=android" >> $GITHUB_ENV
          ls -lh crates/android/release.keystore
      - name: Build APK (cargo-apk2)
        env:
          ANDROID_NDK_ROOT: /usr/local/lib/android/sdk/ndk/27.0.12077973
        run: |
          cargo apk2 build --release -p android
          ls -R target
          # Find generated apk (cargo-apk2 places under target/android-artifacts or target/apk)
          APK=$(find target -type f -name "*.apk" | head -n 1)
          echo "Found APK: $APK"
          if [ -z "$APK" ]; then
            echo "APK not found!"
            exit 1
          fi
          cp "$APK" Cross_Cleaner_Android.apk
      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: |
            Cross_Cleaner_Android.apk
  create_release:
    needs:
      [
        build_linux,
        build_linux_arm64,
        build_linux_packages,
        build_linux_packages_arm64,
        build_windows,
        build_windows_arm64,
        build_macos_arm64,
        build_android,
      ]
    runs-on: ubuntu-latest
    name: Create Release
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          # conventional-release resolves the previous release tag and validates
          # the commit messages, which needs the full history and all tags.
          fetch-depth: 0
          # The Action pushes the tag itself using an explicit credential
          # helper, so the token does not need to be left in .git/config where
          # the other steps of this job could reach it.
          persist-credentials: false
      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-binaries
          path: linux-binaries
      - name: Download Linux Arm64 artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-binaries-arm64
          path: linux-binaries-arm64
      - name: Download Linux packages (.deb, .AppImage)
        uses: actions/download-artifact@v4
        with:
          name: linux-packages
          path: linux-packages
      - name: Download Linux arm64 packages (.deb, .AppImage)
        uses: actions/download-artifact@v4
        with:
          name: linux-packages-arm64
          path: linux-packages-arm64
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-binaries
          path: windows-binaries
      - name: Download Windows Arm64 artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-binaries-arm64
          path: windows-binaries-arm64
      - name: Download Windows Arm64 setup artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-setup-arm64
          path: windows-setup-arm64
      - name: Download MacOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-binaries-arm64
          path: macos-binaries-arm64
      - name: Download Windows setup artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-setup
          path: windows-setup
      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: android-apk
      # Creates the tag, pushes it, and creates the draft GitHub Release whose
      # notes are the changelog generated from the Conventional Commits made
      # since the previous release tag.
      #
      # The version is passed explicitly instead of being derived from the commit
      # log because this project uses four-component versions (2.0.4.2.1), which
      # are not valid semver.
      #
      # This must stay the last step of the job: the Action creates the release
      # in its post step, and only runs it if every step succeeded.
      - name: Create Release
        uses: Nekiplay/conventional-release@main
        with:
          manual-version: ${{ env.APP_VERSION }}
          release-branch: main
          github-release-enabled: true
          # The release stays unpublished until it is reviewed and the draft is
          # published by hand.
          github-release-draft: true
          github-release-title: "🌟 Cross Cleaner ${{ env.APP_VERSION }} 🌟"
          # Markdown placed above the generated changelog. `%s` is replaced with
          # the release version, so these badges stay correct without being
          # edited for every release.
          #
          # Every link points at this specific tag rather than at `latest` or
          # the releases index, so the badges never lead to another version.
          #
          # The downloads badge counts every published release instead of this
          # one: shields.io resolves a badge from published releases only, and
          # this workflow creates the release as a draft — a per-tag downloads
          # badge renders "repo or release not found" for the whole review, and
          # only starts working once the draft is published. The link still
          # points at this version.
          github-release-notes-prepend: |
            [![Downloads](https://img.shields.io/github/downloads/${{ github.repository }}/total?style=flat-square&label=downloads)](https://github.com/${{ github.repository }}/releases/tag/v%s)
            [![Version](https://img.shields.io/badge/version-%s-blue?style=flat-square&label=version)](https://github.com/${{ github.repository }}/releases/tag/v%s)
            [![License](https://img.shields.io/badge/license-GPLv3-blue?style=flat-square)](https://github.com/${{ github.repository }}/blob/main/LICENSE)
          github-release-files: |
            linux-binaries/Linux-Cross_Cleaner_GUI
            linux-binaries/Linux-Cross_Cleaner_TUI
            linux-binaries/Linux-Cross_Cleaner_CLI
            linux-binaries-arm64/Linux-Arm64-Cross_Cleaner_GUI
            linux-binaries-arm64/Linux-Arm64-Cross_Cleaner_TUI
            linux-binaries-arm64/Linux-Arm64-Cross_Cleaner_CLI
            linux-packages/*.deb
            linux-packages/*.AppImage
            linux-packages-arm64/*.deb
            linux-packages-arm64/*.AppImage
            macos-binaries-arm64/MacOS-Arm64-Cross_Cleaner_GUI
            macos-binaries-arm64/MacOS-Arm64-Cross_Cleaner_TUI
            macos-binaries-arm64/MacOS-Arm64-Cross_Cleaner_CLI
            windows-binaries/Windows-Cross_Cleaner_GUI.exe
            windows-binaries/Windows-Cross_Cleaner_TUI.exe
            windows-binaries/Windows-Cross_Cleaner_CLI.exe
            windows-binaries-arm64/Windows-Arm64-Cross_Cleaner_GUI.exe
            windows-binaries-arm64/Windows-Arm64-Cross_Cleaner_TUI.exe
            windows-binaries-arm64/Windows-Arm64-Cross_Cleaner_CLI.exe
            windows-setup/Cross_Cleaner_Setup.exe
            windows-setup-arm64/Cross_Cleaner_Setup_Arm64.exe
            android-apk/Cross_Cleaner_Android.apk

  # The release is created as a draft, so the publication jobs (winget submit
  # and program catalogs) cannot run here: winget-releaser reads the release
  # over the API and gets a 404 while the release is a draft. They live in
  # publish.yml instead, which is run by hand after the draft is published.
