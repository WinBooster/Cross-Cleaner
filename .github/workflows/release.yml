          github-release-notes-prepend: "[![Downloads](https://img.shields.io/github/downloads/${{ github.repository }}/v%s/total?style=flat-square&label=downloads)](https://github.com/${{ github.repository }}/releases/tag/v%s) [![Version](https://img.shields.io/badge/version-%s-blue?style=flat-square&label=version)](https://github.com/${{ github.repository }}/releases/tag/v%s) [![License](https://img.shields.io/badge/license-GPLv3-blue?style=flat-square)](https://github.com/${{ github.repository }}/blob/main/LICENSE)"
          github-release-files: |
