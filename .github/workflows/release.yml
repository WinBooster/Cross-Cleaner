name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version number (e.g., 2.0.2.4)"
        required: true
        default: "2.0.2.5"

env:
  CARGO_TERM_COLOR: always
  APP_VERSION: ${{ github.event.inputs.version }}

jobs:
  formating_code:
    runs-on: ubuntu-latest
    permissions: write-all
    name: Formating code
    steps:
      - uses: actions/checkout@v4
      - name: Update Cargo.toml version
        run: |
          CARGO_VERSION=$(echo "${{ env.APP_VERSION }}" | cut -d. -f1-3)
          # fallback: keep original if cut fails
          if [ -z "$CARGO_VERSION" ]; then CARGO_VERSION="${{ env.APP_VERSION }}"; fi
          echo "APP_VERSION=${{ env.APP_VERSION }} -> CARGO_VERSION=$CARGO_VERSION"
          # Validate semver (cargo will reject 4 parts like 2.0.3.8)
          if ! echo "$CARGO_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'; then
            echo "ERROR: CARGO_VERSION $CARGO_VERSION is not valid semver"
            exit 1
          fi
          find . -name Cargo.toml -exec sed -i "s/^version = .*/version = \"$CARGO_VERSION\"/" {} +
          echo "Updated Cargo.toml files to $CARGO_VERSION:"
          grep -r "^version = " --include="Cargo.toml" .
      - name: Formating code
        run: cargo fmt
      - name: Commit changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add .
          git commit -m "Auto format code" || echo "No changes to commit"
          git push || echo "No changes to push"

  sort_json:
    runs-on: ubuntu-latest
    name: Sorting json
    permissions: write-all
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sort JSON files by program field
        run: |
          sudo apt-get -y install jq

          JSON_FILES=("database/linux_database.json" "database/windows_database.json" "database/registry_database.json" "database/macos_database.json" "database/android_database.json")
          for JSON_FILE in "${JSON_FILES[@]}"; do
            echo "Processing $JSON_FILE..."

            if [ ! -f "$JSON_FILE" ]; then
              echo "Error: JSON file not found at $JSON_FILE"
              exit 1
            fi

            jq 'sort_by(.program | ascii_downcase)' "$JSON_FILE" > "${JSON_FILE}.tmp"

            if [ $? -eq 0 ]; then
              mv "${JSON_FILE}.tmp" "$JSON_FILE"
              echo "Successfully sorted $JSON_FILE"
            else
              echo "Error: Failed to sort $JSON_FILE"
              exit 1
            fi
          done

          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add "${JSON_FILES[@]}"
          git commit -m "Auto-sorted JSON files by program field" || echo "No changes to commit"
          git push || echo "No changes to push"

  upload_databases:
    needs: [sort_json]
    runs-on: ubuntu-latest
    name: Archive databases
    permissions: write-all

    steps:
      - uses: actions/checkout@v4
      - name: Move databases
        run: |
          mv database/linux_database.json linux_database.json
          mv database/windows_database.json windows_database.json
          mv database/registry_database.json registry_database.json
          mv database/macos_database.json macos_database.json
          mv database/android_database.json android_database.json
      - name: Upload databases to artifacts
        uses: actions/upload-artifact@v4
        with:
          name: databases
          path: |
            linux_database.json
            windows_database.json
            registry_database.json
            macos_database.json
            android_database.json

  build_linux:
    runs-on: ubuntu-latest
    needs: [sort_json]
    permissions: write-all
    name: Build Linux
    steps:
      - uses: actions/checkout@v4
      - name: Install ALSA dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev
      - name: Build linux
        run: cargo +nightly build --release -p desktop
      - name: Move linux binaries
        run: |
          mv target/release/desktop Linux-Cross_Cleaner_GUI
      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-binaries
          path: |
            Linux-Cross_Cleaner_GUI
  build_windows:
    runs-on: windows-latest
    needs: [sort_json]
    permissions: write-all
    name: Build Windows
    steps:
      - uses: actions/checkout@v4
      - name: Build windows
        run: cargo +nightly build --release -p desktop
      - name: Move windows binaries
        run: |
          copy target\release\desktop.exe Windows-Cross_Cleaner_GUI.exe
      - name: Update installer version
        shell: pwsh
        run: |
          (Get-Content build_setup.iss) -replace '#define MyAppVersion ".*"', '#define MyAppVersion "${{ env.APP_VERSION }}"' | Set-Content build_setup.iss
      - name: Build installer (Inno Setup)
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.9
        with:
          path: build_setup.iss
      - name: Upload Windows setup artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-setup
          if-no-files-found: error
          path: |
            innosetup\compiler\Cross_Cleaner_Setup.exe
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: |
            Windows-Cross_Cleaner_GUI.exe
  build_macos_arm64:
    runs-on: macos-latest
    needs: [sort_json]
    permissions: write-all
    name: Build MacOS Arm64
    steps:
      - uses: actions/checkout@v4
      - name: Build macos
        run: cargo +nightly build --release -p desktop
      - name: Move macos binaries
        run: |
          mv target/release/desktop MacOS-Arm64-Cross_Cleaner_GUI
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-binaries-arm64
          path: |
            MacOS-Arm64-Cross_Cleaner_GUI
  build_android:
    runs-on: ubuntu-latest
    needs: [sort_json]
    permissions: write-all
    name: Build Android APK
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
      - name: Install cargo-apk2
        run: cargo install cargo-apk2 --locked
      - name: Install Android targets
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android i686-linux-android
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973"
      - name: Generate release keystore
        run: |
          keytool -genkey -v -keystore android/release.keystore -storepass android -alias androidreleasekey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Release,O=Android,C=US"
          echo "CARGO_APK_RELEASE_KEYSTORE=$GITHUB_WORKSPACE/android/release.keystore" >> $GITHUB_ENV
          echo "CARGO_APK_RELEASE_KEYSTORE_PASSWORD=android" >> $GITHUB_ENV
          ls -lh android/release.keystore
      - name: Build APK (cargo-apk2)
        env:
          ANDROID_NDK_ROOT: /usr/local/lib/android/sdk/ndk/27.0.12077973
        run: |
          cargo apk2 build --release -p android
          ls -R target
          # Find generated apk (cargo-apk2 places under target/android-artifacts or target/apk)
          APK=$(find target -type f -name "*.apk" | head -n 1)
          echo "Found APK: $APK"
          if [ -z "$APK" ]; then
            echo "APK not found!"
            exit 1
          fi
          mkdir -p android-release
          cp "$APK" android-release/Cross_Cleaner_Android.apk
          cp "$APK" Cross_Cleaner_Android.apk
          ls -lh android-release/
      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: |
            Cross_Cleaner_Android.apk
            android-release/Cross_Cleaner_Android.apk
  create_release:
    needs: [build_linux, build_windows, build_macos_arm64, build_android]
    runs-on: ubuntu-latest
    name: Create Release
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-binaries
          path: linux-binaries
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-binaries
          path: windows-binaries
      - name: Download MacOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-binaries-arm64
          path: macos-binaries-arm64
      - name: Download Windows setup artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-setup
          path: windows-setup
      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: android-apk
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: 🌟 Cross Cleaner ${{ env.APP_VERSION }} 🌟
          body: |
            ![Downloads](https://img.shields.io/github/downloads/WinBooster/Cross-Cleaner/v${{ env.APP_VERSION }}/total) ![Version](https://img.shields.io/badge/version-${{ env.APP_VERSION }}-blue) ![Platform](https://img.shields.io/badge/platform-Windows%20|%20Linux%20|%20MacOS%20|%20Android-orange)

            ## ✨ What's New

            ### 🪟 Windows Enhancements
            - **Jitsi** Added documentation clearing
            - **Steam** Improved logs clearing
            - **Windhawk** Added logs, cache clearing
            - **ShareX** Added image compression 
            - **Windows** Added image compression
            
            ### 🛠 Technical Updates
            - Added sounds volume settings
            
            ## 👏 Contributors Hall of Fame
            Special thanks to our amazing contributors who made this release possible:
            - **@Nekiplay** - Core improvements and feature implementations

            ---
            *Thank you for using Cross Cleaner! Your system, cleaner than ever.*
          files: |
            linux-binaries/Linux-Cross_Cleaner_GUI
            macos-binaries-arm64/MacOS-Arm64-Cross_Cleaner_GUI
            windows-binaries/Windows-Cross_Cleaner_GUI.exe
            windows-setup/Cross_Cleaner_Setup.exe
            android-apk/Cross_Cleaner_Android.apk

  generate-lists:
    name: Generating clearing programs list
    needs: [create_release]
    permissions:
      contents: write
    uses: ./.github/workflows/update_program_lists.yml
    with:
      version: ${{ github.event.inputs.version }}

  winget_release:
    name: Update package on winget
    needs: [create_release]
    runs-on: windows-latest
    steps:
      - name: Release to winget
        uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: WinBooster.Cross_Cleaner
          version: ${{ env.APP_VERSION }}
          release-tag: v${{ env.APP_VERSION }}
          release-notes-url: https://github.com/${{ github.repository }}/releases/tag/v${{ env.APP_VERSION }}
          installers-regex: '^Cross_Cleaner_Setup\.exe$'
          max-versions-to-keep: 0
          fork-user: Nekiplay
          token: ${{ secrets.WINGET_TOKEN }}
