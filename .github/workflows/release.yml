            linux-binaries-arm64/Linux-Arm64-Cross_Cleaner_CLI
            linux-binaries-arm64-no-updater/Linux-Arm64-Cross_Cleaner_GUI-no-updater
            linux-binaries-arm64-no-updater/Linux-Arm64-Cross_Cleaner_TUI-no-updater
            linux-binaries-arm64-no-updater/Linux-Arm64-Cross_Cleaner_CLI-no-updater
            linux-binaries/Linux-Cross_Cleaner.tar.gz
            linux-binaries-arm64/Linux-Arm64-Cross_Cleaner.tar.gz
            linux-packages/*.deb
