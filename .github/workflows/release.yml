name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version number (e.g., 2.0.2.4)"
        required: true
        default: "2.0.2.5"

env:
  CARGO_TERM_COLOR: always
  APP_VERSION: ${{ github.event.inputs.version }}

jobs:
  formating_code:
    runs-on: ubuntu-latest
    permissions: write-all
    name: Formating code
    steps:
      - uses: actions/checkout@v4
      - name: Update Cargo.toml version
        run: |
          CARGO_VERSION=$(echo "${{ env.APP_VERSION }}" | cut -d. -f1-3)
          # fallback: keep original if cut fails
          if [ -z "$CARGO_VERSION" ]; then CARGO_VERSION="${{ env.APP_VERSION }}"; fi
          echo "APP_VERSION=${{ env.APP_VERSION }} -> CARGO_VERSION=$CARGO_VERSION"
          # Validate semver (cargo will reject 4 parts like 2.0.3.8)
          if ! echo "$CARGO_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'; then
            echo "ERROR: CARGO_VERSION $CARGO_VERSION is not valid semver"
            exit 1
          fi
          find . -name Cargo.toml -exec sed -i "s/^version = .*/version = \"$CARGO_VERSION\"/" {} +
          echo "Updated Cargo.toml files to $CARGO_VERSION:"
          grep -r "^version = " --include="Cargo.toml" .
      - name: Formating code
        run: cargo fmt
      - name: Commit changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add .
          # Conventional Commits: these messages end up in the release notes, so
          # a plain "Auto format code" would land in the changelog unformatted.
          git commit -m "chore: apply rustfmt" || echo "No changes to commit"
          git push || echo "No changes to push"

  sort_json:
    runs-on: ubuntu-latest
    name: Sorting json
    permissions: write-all
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sort JSON files by program field
        run: |
          sudo apt-get -y install jq

          JSON_FILES=("crates/database/linux_database.json" "crates/database/windows_database.json" "crates/database/registry_database.json" "crates/database/macos_database.json" "crates/database/android_database.json")
          for JSON_FILE in "${JSON_FILES[@]}"; do
            echo "Processing $JSON_FILE..."

            if [ ! -f "$JSON_FILE" ]; then
              echo "Error: JSON file not found at $JSON_FILE"
              exit 1
            fi

            jq 'sort_by(.program | ascii_downcase)' "$JSON_FILE" > "${JSON_FILE}.tmp"

            if [ $? -eq 0 ]; then
              mv "${JSON_FILE}.tmp" "$JSON_FILE"
              echo "Successfully sorted $JSON_FILE"
            else
              echo "Error: Failed to sort $JSON_FILE"
              exit 1
            fi
          done

          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add "${JSON_FILES[@]}"
          git commit -m "chore(database): sort programs by name" || echo "No changes to commit"
          git push || echo "No changes to push"

  upload_databases:
    needs: [sort_json]
    runs-on: ubuntu-latest
    name: Archive databases
    permissions: write-all

    steps:
      - uses: actions/checkout@v4
      - name: Move databases
        run: |
          mv crates/database/linux_database.json linux_database.json
          mv crates/database/windows_database.json windows_database.json
          mv crates/database/registry_database.json registry_database.json
          mv crates/database/macos_database.json macos_database.json
          mv crates/database/android_database.json android_database.json
      - name: Upload databases to artifacts
        uses: actions/upload-artifact@v4
        with:
          name: databases
          path: |
            linux_database.json
            windows_database.json
            registry_database.json
            macos_database.json
            android_database.json

  build_linux:
    runs-on: ubuntu-latest
    needs: [sort_json]
    permissions: write-all
    name: Build Linux
    steps:
      - uses: actions/checkout@v4
      - name: Install ALSA dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev
      - name: Build linux
        run: |
          cargo +nightly build --release -p desktop
          cargo +nightly build --release -p tui
          cargo +nightly build --release -p cli
      - name: Move linux binaries
        run: |
          mv target/release/desktop Linux-Cross_Cleaner_GUI
          mv target/release/tui Linux-Cross_Cleaner_TUI
          mv target/release/cli Linux-Cross_Cleaner_CLI
      - name: Bundle a portable tar.gz
        # For systems with neither apt nor dnf: the same three binaries the
        # release already publishes bare, plus the legal and the "what is
        # this" file, in one download. The binaries keep their self-update
        # feature on purpose -- unlike the .deb/.rpm/.AppImage, this archive
        # is a portable download family, not a package-manager install, so
        # nothing forbids the app from updating itself.
        run: |
          tar --owner=0 --group=0 -czf Linux-Cross_Cleaner.tar.gz \
            Linux-Cross_Cleaner_GUI \
            Linux-Cross_Cleaner_TUI \
            Linux-Cross_Cleaner_CLI \
            LICENSE \
            README.md
      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-binaries
          path: |
            Linux-Cross_Cleaner_GUI
            Linux-Cross_Cleaner_TUI
            Linux-Cross_Cleaner_CLI
            Linux-Cross_Cleaner.tar.gz
  build_linux_no_updater:
    # Same binaries as `build_linux`, built with `--no-default-features` so the
    # `self-update` feature is compiled out rather than merely turned off at
    # runtime: this build never checks GitHub for a newer release, never shows an
    # update notification, and never replaces its own executable.
    #
    # The `-no-updater` suffix is only the published name; anyone who wants an
    # install that cannot update itself picks this asset instead of the default
    # one.
    runs-on: ubuntu-latest
    needs: [sort_json]
    permissions: write-all
    name: Build Linux (no updater)
    steps:
      - uses: actions/checkout@v4
      - name: Install ALSA dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev
      - name: Build linux without self-update
        run: |
          cargo +nightly build --release -p desktop --no-default-features
          cargo +nightly build --release -p tui --no-default-features
          cargo +nightly build --release -p cli --no-default-features
      - name: Move linux binaries
        run: |
          mv target/release/desktop Linux-Cross_Cleaner_GUI-no-updater
          mv target/release/tui Linux-Cross_Cleaner_TUI-no-updater
          mv target/release/cli Linux-Cross_Cleaner_CLI-no-updater
      - name: Upload Linux no-updater artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-binaries-no-updater
          path: |
            Linux-Cross_Cleaner_GUI-no-updater
            Linux-Cross_Cleaner_TUI-no-updater
            Linux-Cross_Cleaner_CLI-no-updater
  build_linux_arm64:
    # Native arm64 runner, so the build is the same job as `build_linux` on a
    # different CPU rather than a cross-compile. The asset names carry `-Arm64`
    # because `database::version` resolves the update asset per architecture.
    runs-on: ubuntu-24.04-arm
    needs: [sort_json]
    permissions: write-all
    name: Build Linux Arm64
    steps:
      - uses: actions/checkout@v4
      - name: Install ALSA dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev
      - name: Build linux arm64
        run: |
          cargo +nightly build --release -p desktop
          cargo +nightly build --release -p tui
          cargo +nightly build --release -p cli
      - name: Move linux arm64 binaries
        run: |
          mv target/release/desktop Linux-Arm64-Cross_Cleaner_GUI
          mv target/release/tui Linux-Arm64-Cross_Cleaner_TUI
          mv target/release/cli Linux-Arm64-Cross_Cleaner_CLI
      - name: Bundle a portable tar.gz
        # Same bundle as the x64 build_linux job above, for arm64 machines.
        run: |
          tar --owner=0 --group=0 -czf Linux-Arm64-Cross_Cleaner.tar.gz \
            Linux-Arm64-Cross_Cleaner_GUI \
            Linux-Arm64-Cross_Cleaner_TUI \
            Linux-Arm64-Cross_Cleaner_CLI \
            LICENSE \
            README.md
      - name: Upload Linux Arm64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-binaries-arm64
          path: |
            Linux-Arm64-Cross_Cleaner_GUI
            Linux-Arm64-Cross_Cleaner_TUI
            Linux-Arm64-Cross_Cleaner_CLI
            Linux-Arm64-Cross_Cleaner.tar.gz
  build_linux_arm64_no_updater:
    # Native arm64 runner: same as `build_linux_no_updater` on a different CPU.
    # See that job for why `self-update` is compiled out and the name is suffixed.
    runs-on: ubuntu-24.04-arm
    needs: [sort_json]
    permissions: write-all
    name: Build Linux Arm64 (no updater)
    steps:
      - uses: actions/checkout@v4
      - name: Install ALSA dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev
      - name: Build linux arm64 without self-update
        run: |
          cargo +nightly build --release -p desktop --no-default-features
          cargo +nightly build --release -p tui --no-default-features
          cargo +nightly build --release -p cli --no-default-features
      - name: Move linux arm64 binaries
        run: |
          mv target/release/desktop Linux-Arm64-Cross_Cleaner_GUI-no-updater
          mv target/release/tui Linux-Arm64-Cross_Cleaner_TUI-no-updater
          mv target/release/cli Linux-Arm64-Cross_Cleaner_CLI-no-updater
      - name: Upload Linux Arm64 no-updater artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-binaries-arm64-no-updater
          path: |
            Linux-Arm64-Cross_Cleaner_GUI-no-updater
            Linux-Arm64-Cross_Cleaner_TUI-no-updater
            Linux-Arm64-Cross_Cleaner_CLI-no-updater
  build_linux_packages:
    # Distribution packages for Linux, published next to the portable binaries.
    #
    # Two deliberate differences from `build_linux`:
    #
    # 1. `self-update` is compiled OUT. Both crates document why in their
    #    Cargo.toml: a package-manager install owns its version, so the app
    #    must neither advertise a newer release nor replace the file dpkg,
    #    rpm or AppImage put on disk. Building these packages with the default
    #    features would ship something that fights its own package manager.
    # 2. The binaries land as `cross-cleaner`, `cross-cleaner-tui` and
    #    `cross-cleaner-cli`, not as `Linux-Cross_Cleaner_GUI`, because a
    #    desktop entry's Exec line and a /usr/bin entry need a name that does
    #    not change every release.
    #
    # Everything generated lands under target/pkg, which is gitignored. The
    # sibling `formating_code` job runs `git add .` and pushes, so build output
    # anywhere else would end up committed.
    #
    # The packaging itself is a composite action shared with the arm64 job, so
    # the two cannot drift apart.
    runs-on: ubuntu-24.04
    needs: [sort_json]
    permissions: write-all
    name: Build Linux packages x64 (.deb, .rpm, .AppImage)
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev

      - name: Build binaries without self-update
        run: cargo +nightly build --release -p desktop --no-default-features
      - name: Build terminal binary without self-update
        run: cargo +nightly build --release -p tui --no-default-features
      - name: Build command-line binary without self-update
        run: cargo +nightly build --release -p cli --no-default-features

      - name: Package
        uses: ./.github/actions/linux-package
        with:
          arch: x86_64
          artifact-name: linux-packages
          app-version: ${{ env.APP_VERSION }}

  build_linux_packages_arm64:
    # Native arm64 runner, so this is the same job as `build_linux_packages` on a
    # different CPU rather than a cross-compile. There is no cross-compiled .deb
    # or .rpm: dpkg, rpm and AppImage all encode the target architecture in the
    # artifact, so the payload has to be built for it.
    runs-on: ubuntu-24.04-arm
    needs: [sort_json]
    permissions: write-all
    name: Build Linux packages arm64 (.deb, .rpm, .AppImage)
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev

      - name: Build binaries without self-update
        run: cargo +nightly build --release -p desktop --no-default-features
      - name: Build terminal binary without self-update
        run: cargo +nightly build --release -p tui --no-default-features
      - name: Build command-line binary without self-update
        run: cargo +nightly build --release -p cli --no-default-features

      - name: Package
        uses: ./.github/actions/linux-package
        with:
          arch: aarch64
          artifact-name: linux-packages-arm64
          app-version: ${{ env.APP_VERSION }}

  build_windows:
    runs-on: windows-latest
    needs: [sort_json]
    permissions: write-all
    name: Build Windows
    steps:
      - uses: actions/checkout@v4
      - name: Build windows
        run: |
          cargo +nightly build --release -p desktop
          cargo +nightly build --release -p tui
          cargo +nightly build --release -p cli
      - name: Move windows binaries
        run: |
          copy target\release\desktop.exe Windows-Cross_Cleaner_GUI.exe
          copy target\release\tui.exe Windows-Cross_Cleaner_TUI.exe
          copy target\release\cli.exe Windows-Cross_Cleaner_CLI.exe
      - name: Update installer version
        shell: pwsh
        run: |
          (Get-Content build_setup.iss) -replace '#define MyAppVersion ".*"', '#define MyAppVersion "${{ env.APP_VERSION }}"' | Set-Content build_setup.iss
      - name: Build installer (Inno Setup)
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.9
        with:
          path: build_setup.iss
          # Default x64 branch of build_setup.iss. The architecture is a script
          # parameter so the arm64 job can reuse this file; see the arm64 job.
          options: |
            /DMyArch=x64
      - name: Upload Windows setup artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-setup
          if-no-files-found: error
          path: |
            innosetup\compiler\Cross_Cleaner_Setup.exe
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: |
            Windows-Cross_Cleaner_GUI.exe
            Windows-Cross_Cleaner_TUI.exe
            Windows-Cross_Cleaner_CLI.exe
  build_windows_no_updater:
    # Portable Windows binaries with `self-update` compiled out, so `-no-updater`
    # builds never look for a newer release nor overwrite themselves. The Inno
    # Setup installer is built from the same `--no-default-features` desktop.exe
    # and published as `Cross_Cleaner_Setup-no-updater.exe`.
    runs-on: windows-latest
    needs: [sort_json]
    permissions: write-all
    name: Build Windows (no updater)
    steps:
      - uses: actions/checkout@v4
      - name: Build windows without self-update
        run: |
          cargo +nightly build --release -p desktop --no-default-features
          cargo +nightly build --release -p tui --no-default-features
          cargo +nightly build --release -p cli --no-default-features
      - name: Move windows binaries
        run: |
          copy target\release\desktop.exe Windows-Cross_Cleaner_GUI-no-updater.exe
          copy target\release\tui.exe Windows-Cross_Cleaner_TUI-no-updater.exe
          copy target\release\cli.exe Windows-Cross_Cleaner_CLI-no-updater.exe
      - name: Update installer version
        shell: pwsh
        run: |
          (Get-Content build_setup.iss) -replace '#define MyAppVersion ".*"', '#define MyAppVersion "${{ env.APP_VERSION }}"' | Set-Content build_setup.iss
      - name: Build installer (Inno Setup, no updater)
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.9
        with:
          path: build_setup.iss
          # `MyNoUpdater` makes the output `Cross_Cleaner_Setup-no-updater.exe`
          # so it never collides with the self-updating installer. It packages
          # `target\release\desktop.exe`, which this job built without the feature.
          options: |
            /DMyArch=x64
            /DMyNoUpdater
      - name: Upload Windows no-updater setup artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-setup-no-updater
          if-no-files-found: error
          path: |
            innosetup\compiler\Cross_Cleaner_Setup-no-updater.exe
      - name: Upload Windows no-updater artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-binaries-no-updater
          path: |
            Windows-Cross_Cleaner_GUI-no-updater.exe
            Windows-Cross_Cleaner_TUI-no-updater.exe
            Windows-Cross_Cleaner_CLI-no-updater.exe
  build_windows_arm64:
    # Native arm64 runner, so no cross-linker is involved. The installer is named
    # `..._Arm64.exe`, which keeps it out of the winget match on the x64 name.
    runs-on: windows-11-arm
    needs: [sort_json]
    permissions: write-all
    name: Build Windows Arm64
    steps:
      - uses: actions/checkout@v4
      - name: Build windows arm64
        run: |
          cargo +nightly build --release -p desktop
          cargo +nightly build --release -p tui
          cargo +nightly build --release -p cli
      - name: Move windows arm64 binaries
        run: |
          copy target\release\desktop.exe Windows-Arm64-Cross_Cleaner_GUI.exe
          copy target\release\tui.exe Windows-Arm64-Cross_Cleaner_TUI.exe
          copy target\release\cli.exe Windows-Arm64-Cross_Cleaner_CLI.exe
      - name: Update installer version
        shell: pwsh
        run: |
          (Get-Content build_setup.iss) -replace '#define MyAppVersion ".*"', '#define MyAppVersion "${{ env.APP_VERSION }}"' | Set-Content build_setup.iss
      - name: Build installer (Inno Setup, arm64)
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.9
        with:
          path: build_setup.iss
          # Selects the arm64 branch of build_setup.iss: ArchitecturesAllowed=arm64
          # and the `_Arm64` output name.
          options: |
            /DMyArch=arm64
      - name: Upload Windows Arm64 setup artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-setup-arm64
          if-no-files-found: error
          path: |
            innosetup\compiler\Cross_Cleaner_Setup_Arm64.exe
      - name: Upload Windows Arm64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-binaries-arm64
          if-no-files-found: error
          path: |
            Windows-Arm64-Cross_Cleaner_GUI.exe
            Windows-Arm64-Cross_Cleaner_TUI.exe
            Windows-Arm64-Cross_Cleaner_CLI.exe
  build_windows_arm64_no_updater:
    # Native arm64 runner, portable exes plus the `-no-updater` installer. Same
    # `--no-default-features` build as `build_windows_no_updater`, for the arm64
    # CPU.
    runs-on: windows-11-arm
    needs: [sort_json]
    permissions: write-all
    name: Build Windows Arm64 (no updater)
    steps:
      - uses: actions/checkout@v4
      - name: Build windows arm64 without self-update
        run: |
          cargo +nightly build --release -p desktop --no-default-features
          cargo +nightly build --release -p tui --no-default-features
          cargo +nightly build --release -p cli --no-default-features
      - name: Move windows arm64 binaries
        run: |
          copy target\release\desktop.exe Windows-Arm64-Cross_Cleaner_GUI-no-updater.exe
          copy target\release\tui.exe Windows-Arm64-Cross_Cleaner_TUI-no-updater.exe
          copy target\release\cli.exe Windows-Arm64-Cross_Cleaner_CLI-no-updater.exe
      - name: Update installer version
        shell: pwsh
        run: |
          (Get-Content build_setup.iss) -replace '#define MyAppVersion ".*"', '#define MyAppVersion "${{ env.APP_VERSION }}"' | Set-Content build_setup.iss
      - name: Build installer (Inno Setup, arm64, no updater)
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.9
        with:
          path: build_setup.iss
          # arm64 output name is `Cross_Cleaner_Setup_Arm64-no-updater.exe`: the
          # arch marker comes from MyArch, the suffix from /DMyNoUpdater.
          options: |
            /DMyArch=arm64
            /DMyNoUpdater
      - name: Upload Windows Arm64 no-updater setup artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-setup-arm64-no-updater
          if-no-files-found: error
          path: |
            innosetup\compiler\Cross_Cleaner_Setup_Arm64-no-updater.exe
      - name: Upload Windows Arm64 no-updater artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-binaries-arm64-no-updater
          if-no-files-found: error
          path: |
            Windows-Arm64-Cross_Cleaner_GUI-no-updater.exe
            Windows-Arm64-Cross_Cleaner_TUI-no-updater.exe
            Windows-Arm64-Cross_Cleaner_CLI-no-updater.exe
  build_macos_arm64:
    runs-on: macos-latest
    needs: [sort_json]
    permissions: write-all
    name: Build MacOS Arm64
    steps:
      - uses: actions/checkout@v4
      - name: Build macos
        run: |
          cargo +nightly build --release -p desktop
          cargo +nightly build --release -p tui
          cargo +nightly build --release -p cli
      - name: Move macos binaries
        run: |
          mv target/release/desktop MacOS-Arm64-Cross_Cleaner_GUI
          mv target/release/tui MacOS-Arm64-Cross_Cleaner_TUI
          mv target/release/cli MacOS-Arm64-Cross_Cleaner_CLI
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-binaries-arm64
          path: |
            MacOS-Arm64-Cross_Cleaner_GUI
            MacOS-Arm64-Cross_Cleaner_TUI
            MacOS-Arm64-Cross_Cleaner_CLI
  build_macos_arm64_no_updater:
    # macOS only ships arm64, so this is the only `-no-updater` macOS build. Same
    # `self-update`-less build as the other `-no-updater` jobs.
    runs-on: macos-latest
    needs: [sort_json]
    permissions: write-all
    name: Build MacOS Arm64 (no updater)
    steps:
      - uses: actions/checkout@v4
      - name: Build macos without self-update
        run: |
          cargo +nightly build --release -p desktop --no-default-features
          cargo +nightly build --release -p tui --no-default-features
          cargo +nightly build --release -p cli --no-default-features
      - name: Move macos binaries
        run: |
          mv target/release/desktop MacOS-Arm64-Cross_Cleaner_GUI-no-updater
          mv target/release/tui MacOS-Arm64-Cross_Cleaner_TUI-no-updater
          mv target/release/cli MacOS-Arm64-Cross_Cleaner_CLI-no-updater
      - name: Upload MacOS no-updater artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-binaries-arm64-no-updater
          path: |
            MacOS-Arm64-Cross_Cleaner_GUI-no-updater
            MacOS-Arm64-Cross_Cleaner_TUI-no-updater
            MacOS-Arm64-Cross_Cleaner_CLI-no-updater
  build_android:
    runs-on: ubuntu-latest
    needs: [sort_json]
    permissions: write-all
    name: Build Android APK
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
      - name: Install cargo-apk2
        run: cargo install cargo-apk2 --locked
      - name: Install Android targets
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android i686-linux-android
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973"
      - name: Generate release keystore
        run: |
          keytool -genkey -v -keystore crates/android/release.keystore -storepass android -alias androidreleasekey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Release,O=Android,C=US"
          echo "CARGO_APK_RELEASE_KEYSTORE=$GITHUB_WORKSPACE/crates/android/release.keystore" >> $GITHUB_ENV
          echo "CARGO_APK_RELEASE_KEYSTORE_PASSWORD=android" >> $GITHUB_ENV
          ls -lh crates/android/release.keystore
      - name: Build APK (cargo-apk2)
        env:
          ANDROID_NDK_ROOT: /usr/local/lib/android/sdk/ndk/27.0.12077973
        run: |
          cargo apk2 build --release -p android
          ls -R target
          # Find generated apk (cargo-apk2 places under target/android-artifacts or target/apk)
          APK=$(find target -type f -name "*.apk" | head -n 1)
          echo "Found APK: $APK"
          if [ -z "$APK" ]; then
            echo "APK not found!"
            exit 1
          fi
          cp "$APK" Cross_Cleaner_Android.apk
      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: |
            Cross_Cleaner_Android.apk
