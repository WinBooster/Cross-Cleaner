name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version number (e.g., 2.0.2.4)"
        required: true
        default: "2.0.2.5"

env:
  CARGO_TERM_COLOR: always
  APP_VERSION: ${{ github.event.inputs.version }}

jobs:
  formating_code:
    runs-on: ubuntu-latest
    permissions: write-all
    name: Formating code
    steps:
      - uses: actions/checkout@v4
      - name: Update Cargo.toml version
        run: |
          sed -i 's/^version = .*/version = "${{ env.APP_VERSION }}"/' Cargo.toml
          sed -i 's/ProductVersion = .*/ProductVersion = "${{ env.APP_VERSION }}"/' Cargo.toml
      - name: Formating code
        run: cargo fmt
      - name: Commit changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add .
          git commit -m "Auto format code" || echo "No changes to commit"
          git push || echo "No changes to push"

  sort_json:
    runs-on: ubuntu-latest
    name: Sorting json
    permissions: write-all
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sort JSON files by program field
        run: |
          sudo apt-get -y install jq

          JSON_FILES=("database/linux_database.json" "database/windows_database.json" "database/registry_database.json" "database/macos_database.json")
          for JSON_FILE in "${JSON_FILES[@]}"; do
            echo "Processing $JSON_FILE..."

            if [ ! -f "$JSON_FILE" ]; then
              echo "Error: JSON file not found at $JSON_FILE"
              exit 1
            fi

            jq 'sort_by(.program | ascii_downcase)' "$JSON_FILE" > "${JSON_FILE}.tmp"

            if [ $? -eq 0 ]; then
              mv "${JSON_FILE}.tmp" "$JSON_FILE"
              echo "Successfully sorted $JSON_FILE"
            else
              echo "Error: Failed to sort $JSON_FILE"
              exit 1
            fi
          done

          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add "${JSON_FILES[@]}"
          git commit -m "Auto-sorted JSON files by program field" || echo "No changes to commit"
          git push || echo "No changes to push"

  upload_databases:
    needs: [sort_json]
    runs-on: ubuntu-latest
    name: Archive databases
    permissions: write-all

    steps:
      - uses: actions/checkout@v4
      - name: Move databases
        run: |
          mv database/linux_database.json linux_database.json
          mv database/windows_database.json windows_database.json
          mv database/registry_database.json registry_database.json
          mv database/macos_database.json registry_database.json
      - name: Upload databases to artifacts
        uses: actions/upload-artifact@v4
        with:
          name: databases
          path: |
            linux_database.json
            windows_database.json
            registry_database.json
            macos_database.json

  build_linux:
    runs-on: ubuntu-latest
    needs: [sort_json]
    permissions: write-all
    name: Build Linux
    steps:
      - uses: actions/checkout@v4
      - name: Build linux
        run: cargo +nightly build --release
      - name: Move linux binaries
        run: |
          mv target/release/Cross_Cleaner_CLI Linux-Cross_Cleaner_CLI
          mv target/release/Cross_Cleaner_GUI Linux-Cross_Cleaner_GUI
      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-binaries
          path: |
            Linux-Cross_Cleaner_CLI
            Linux-Cross_Cleaner_GUI
  build_windows:
    runs-on: windows-latest
    needs: [sort_json]
    permissions: write-all
    name: Build Windows
    steps:
      - uses: actions/checkout@v4
      - name: Build windows
        run: cargo +nightly build --release
      - name: Move windows binaries
        run: |
          move target\release\Cross_Cleaner_CLI.exe Windows-Cross_Cleaner_CLI.exe
          move target\release\Cross_Cleaner_GUI.exe Windows-Cross_Cleaner_GUI.exe
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: |
            Windows-Cross_Cleaner_CLI.exe
            Windows-Cross_Cleaner_GUI.exe
  build_macos_arm64:
    runs-on: macos-latest
    needs: [sort_json]
    permissions: write-all
    name: Build MacOS Arm64
    steps:
      - uses: actions/checkout@v4
      - name: Build macos
        run: cargo +nightly build --release
      - name: Move macos binaries
        run: |
          mv target/release/Cross_Cleaner_CLI MacOS-Arm64-Cross_Cleaner_CLI
          mv target/release/Cross_Cleaner_GUI MacOS-Arm64-Cross_Cleaner_GUI
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-binaries-arm64
          path: |
            MacOS-Arm64-Cross_Cleaner_CLI
            MacOS-Arm64-Cross_Cleaner_GUI
  create_release:
    needs: [build_linux, build_windows, build_macos_arm64]
    runs-on: ubuntu-latest
    name: Create Release
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-binaries
          path: linux-binaries
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-binaries
          path: windows-binaries
      - name: Download MacOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-binaries-arm64
          path: macos-binaries-arm64
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: 🌟 Cross Cleaner ${{ env.APP_VERSION }} 🌟
          body: |
            ![Downloads](https://img.shields.io/github/downloads/WinBooster/Cross-Cleaner/v${{ env.APP_VERSION }}/total) ![Version](https://img.shields.io/badge/version-${{ env.APP_VERSION }}-blue) ![Platform](https://img.shields.io/badge/platform-Windows%20|%20Linux-orange)

            ## ✨ What's New

            ### 🪟 Windows Enhancements
            - **Salwyrr Launcher** Added documentation clearing
            - **Cliamp** Added logs clearing
            - **FlowLauncher** Added logs, cache, last activity clearing
            - **Recaf** Improved logs clearing
            - **Genshin Impact** Improved logs clearing

            ## 👏 Contributors Hall of Fame
            Special thanks to our amazing contributors who made this release possible:
            - **@Nekiplay** - Core improvements and feature implementations

            ---
            *Thank you for using Cross Cleaner! Your system, cleaner than ever.*
          files: |
            linux-binaries/Linux-Cross_Cleaner_CLI
            linux-binaries/Linux-Cross_Cleaner_GUI
            macos-binaries-arm64/MacOS-Arm64-Cross_Cleaner_CLI
            macos-binaries-arm64/MacOS-Arm64-Cross_Cleaner_GUI
            windows-binaries/Windows-Cross_Cleaner_CLI.exe
            windows-binaries/Windows-Cross_Cleaner_GUI.exe

  generate-lists:
    name: Generating clearing programs list
    needs: [create_release]
    permissions:
      contents: write
    uses: ./.github/workflows/update_program_lists.yml
    with:
      version: ${{ github.event.inputs.version }}
