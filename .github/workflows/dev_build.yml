name: CI

on:
  workflow_dispatch:
  workflow_call:
  push:
    paths:
      - "**/*.toml"
      - "**/*.rs"
      - "**/*.json"
      - ".github/workflows/**"
      - "Cargo.lock"
  pull_request:
    paths:
      - "**/*.toml"
      - "**/*.rs"
      - "**/*.json"
      - ".github/workflows/**"
      - "Cargo.lock"

env:
  CARGO_TERM_COLOR: always
  APP_VERSION: "2.0.1"

jobs:
  formating_code:
    runs-on: ubuntu-latest
    permissions: write-all
    name: Formating code
    steps:
      - uses: actions/checkout@v4
      - name: Update Cargo.toml version
        run: |
          find . -name Cargo.toml -exec sed -i 's/^version = .*/version = "${{ env.APP_VERSION }}"/' {} +
      - name: Formating code
        run: cargo fmt
      - name: Commit changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add .
          # Conventional Commits: these messages end up in the release notes,
          # so a plain "Auto format code" would land in the changelog
          # unformatted.
          git commit -m "chore: apply rustfmt" || echo "No changes to commit"
          git push || echo "No changes to push"

  sort_json:
    runs-on: ubuntu-latest
    name: Sorting json
    permissions: write-all
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sort JSON files by program field
        run: |
          sudo apt-get -y install jq

          JSON_FILES=("crates/database/linux_database.json" "crates/database/windows_database.json" "crates/database/registry_database.json" "crates/database/macos_database.json" "crates/database/android_database.json")
          for JSON_FILE in "${JSON_FILES[@]}"; do
            echo "Processing $JSON_FILE..."

            # Проверяем, существует ли файл
            if [ ! -f "$JSON_FILE" ]; then
              echo "Error: JSON file not found at $JSON_FILE"
              exit 1
            fi

            jq 'sort_by(.program | ascii_downcase)' "$JSON_FILE" > "${JSON_FILE}.tmp"

            if [ $? -eq 0 ]; then
              mv "${JSON_FILE}.tmp" "$JSON_FILE"
              echo "Successfully sorted $JSON_FILE"
            else
              echo "Error: Failed to sort $JSON_FILE"
              exit 1
            fi
          done

          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add "${JSON_FILES[@]}"
          git commit -m "chore(database): sort programs by name" || echo "No changes to commit"
          git push || echo "No changes to push"

  upload_databases:
    needs: [sort_json]
    runs-on: ubuntu-latest
    name: Archive databases
    permissions: write-all

    steps:
      - uses: actions/checkout@v4
      - name: Move databases
        run: |
          mv crates/database/linux_database.json linux_database.json
          mv crates/database/windows_database.json windows_database.json
          mv crates/database/registry_database.json registry_database.json
          mv crates/database/macos_database.json macos_database.json
          mv crates/database/android_database.json android_database.json
      - name: Upload databases to artifacts
        uses: actions/upload-artifact@v4
        with:
          name: databases
          path: |
            linux_database.json
            windows_database.json
            registry_database.json
            macos_database.json
            android_database.json

  build_linux:
    runs-on: ubuntu-latest
    needs: [sort_json]
    permissions: write-all
    name: Build Linux
    steps:
      - uses: actions/checkout@v4
      - name: Install ALSA dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev
      - name: Build linux
        run: |
          cargo +nightly build --release -p desktop
          cargo +nightly build --release -p tui
          cargo +nightly build --release -p cli
      - name: List files for debugging
        run: ls -la target/release/
      - name: Move linux binaries
        run: |
          mv target/release/desktop Cross_Cleaner_GUI_Linux
          mv target/release/tui Cross_Cleaner_TUI_Linux
          mv target/release/cli Cross_Cleaner_CLI_Linux
      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-binaries
          path: |
            Cross_Cleaner_GUI_Linux
            Cross_Cleaner_TUI_Linux
            Cross_Cleaner_CLI_Linux

  build_linux_arm64:
    # Native arm64 runner: the same job as build_linux, no cross-compilation.
    runs-on: ubuntu-24.04-arm
    needs: [sort_json]
    permissions: write-all
    name: Build Linux Arm64
    steps:
      - uses: actions/checkout@v4
      - name: Install ALSA dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev
      - name: Build linux arm64
        run: |
          cargo +nightly build --release -p desktop
          cargo +nightly build --release -p tui
          cargo +nightly build --release -p cli
      - name: List files for debugging
        run: ls -la target/release/
      - name: Move linux arm64 binaries
        run: |
          mv target/release/desktop Cross_Cleaner_GUI_Linux_Arm64
          mv target/release/tui Cross_Cleaner_TUI_Linux_Arm64
          mv target/release/cli Cross_Cleaner_CLI_Linux_Arm64
      - name: Upload Linux Arm64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-binaries-arm64
          path: |
            Cross_Cleaner_GUI_Linux_Arm64
            Cross_Cleaner_TUI_Linux_Arm64
            Cross_Cleaner_CLI_Linux_Arm64

  build_windows:
    runs-on: windows-latest
    needs: [sort_json]
    permissions: write-all
    name: Build Windows
    steps:
      - uses: actions/checkout@v4
      - name: Build windows
        run: |
          cargo +nightly build --release -p desktop
          cargo +nightly build --release -p tui
          cargo +nightly build --release -p cli
      - name: List files for debugging
        run: dir target\release\
      - name: Move windows binaries
        run: |
          move target\release\desktop.exe Cross_Cleaner_GUI_Windows.exe
          move target\release\tui.exe Cross_Cleaner_TUI_Windows.exe
          move target\release\cli.exe Cross_Cleaner_CLI_Windows.exe
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: |
            Cross_Cleaner_GUI_Windows.exe
            Cross_Cleaner_TUI_Windows.exe
            Cross_Cleaner_CLI_Windows.exe

  build_windows_arm64:
    # Native arm64 runner: no cross-linker. No installer here, matching
    # `build_windows`: the dev workflow ships portable binaries only.
    runs-on: windows-11-arm
    needs: [sort_json]
    permissions: write-all
    name: Build Windows Arm64
    steps:
      - uses: actions/checkout@v4
      - name: Build windows arm64
        run: |
          cargo +nightly build --release -p desktop
          cargo +nightly build --release -p tui
          cargo +nightly build --release -p cli
      - name: List files for debugging
        run: dir target\release\
      - name: Move windows arm64 binaries
        run: |
          move target\release\desktop.exe Cross_Cleaner_GUI_Windows_Arm64.exe
          move target\release\tui.exe Cross_Cleaner_TUI_Windows_Arm64.exe
          move target\release\cli.exe Cross_Cleaner_CLI_Windows_Arm64.exe
      - name: Upload Windows Arm64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-binaries-arm64
          path: |
            Cross_Cleaner_GUI_Windows_Arm64.exe
            Cross_Cleaner_TUI_Windows_Arm64.exe
            Cross_Cleaner_CLI_Windows_Arm64.exe
  build_macos:
    runs-on: macos-latest
    needs: [sort_json]
    permissions: write-all
    name: Build MacOS
    steps:
      - uses: actions/checkout@v4
      - name: Build macos
        run: |
          cargo +nightly build --release -p desktop
          cargo +nightly build --release -p tui
          cargo +nightly build --release -p cli
      - name: List files for debugging
        run: ls -la target/release/
      - name: Move macos binaries
        run: |
          mv target/release/desktop Cross_Cleaner_GUI_MacOS
          mv target/release/tui Cross_Cleaner_TUI_MacOS
          mv target/release/cli Cross_Cleaner_CLI_MacOS
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-binaries
          path: |
            Cross_Cleaner_GUI_MacOS
            Cross_Cleaner_TUI_MacOS
            Cross_Cleaner_CLI_MacOS
  build_android:
    runs-on: ubuntu-latest
    needs: [sort_json]
    permissions: write-all
    name: Build Android
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
      - name: Install cargo-apk2
        run: cargo install cargo-apk2 --locked
      - name: Install Android targets
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android i686-linux-android
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973"
      - name: Build APK debug (cargo apk2)
        env:
          ANDROID_NDK_ROOT: /usr/local/lib/android/sdk/ndk/27.0.12077973
        run: |
          cargo apk2 build -p android
          APK=$(find target -type f -name "*.apk" | head -n 1)
          echo "APK: $APK"
          ls -lh "$APK" || true
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-debug
          if-no-files-found: warn
          path: |
            target/**/*.apk
