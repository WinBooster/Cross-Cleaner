name: Development Build and Formating

on:
  workflow_dispatch:
  workflow_call:
  push:
    paths:
      - "**/*.toml"
      - "**/*.rs"
      - "**/*.json"
      - ".github/workflows/**"
      - "Cargo.lock"
  pull_request:
    paths:
      - "**/*.toml"
      - "**/*.rs"
      - "**/*.json"
      - ".github/workflows/**"
      - "Cargo.lock"

env:
  CARGO_TERM_COLOR: always
  APP_VERSION: "2.0.1"

jobs:
  formating_code:
    runs-on: ubuntu-latest
    permissions: write-all
    name: Formating code
    steps:
      - uses: actions/checkout@v4
      - name: Update Cargo.toml version
        run: |
          find . -name Cargo.toml -exec sed -i 's/^version = .*/version = "${{ env.APP_VERSION }}"/' {} +
      - name: Formating code
        run: cargo fmt
      - name: Commit changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add .
          git commit -m "Auto format code" || echo "No changes to commit"
          git push || echo "No changes to push"

  sort_json:
    runs-on: ubuntu-latest
    name: Sorting json
    permissions: write-all
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sort JSON files by program field
        run: |
          sudo apt-get -y install jq

          JSON_FILES=("database/linux_database.json" "database/windows_database.json" "database/registry_database.json" "database/macos_database.json" "database/android_database.json")
          for JSON_FILE in "${JSON_FILES[@]}"; do
            echo "Processing $JSON_FILE..."

            # Проверяем, существует ли файл
            if [ ! -f "$JSON_FILE" ]; then
              echo "Error: JSON file not found at $JSON_FILE"
              exit 1
            fi

            jq 'sort_by(.program | ascii_downcase)' "$JSON_FILE" > "${JSON_FILE}.tmp"

            if [ $? -eq 0 ]; then
              mv "${JSON_FILE}.tmp" "$JSON_FILE"
              echo "Successfully sorted $JSON_FILE"
            else
              echo "Error: Failed to sort $JSON_FILE"
              exit 1
            fi
          done

          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add "${JSON_FILES[@]}"
          git commit -m "Auto-sorted JSON files by program field" || echo "No changes to commit"
          git push || echo "No changes to push"

  upload_databases:
    needs: [sort_json]
    runs-on: ubuntu-latest
    name: Archive databases
    permissions: write-all

    steps:
      - uses: actions/checkout@v4
      - name: Move databases
        run: |
          mv database/linux_database.json linux_database.json
          mv database/windows_database.json windows_database.json
          mv database/registry_database.json registry_database.json
          mv database/macos_database.json macos_database.json
          mv database/android_database.json android_database.json
      - name: Upload databases to artifacts
        uses: actions/upload-artifact@v4
        with:
          name: databases
          path: |
            linux_database.json
            windows_database.json
            registry_database.json
            macos_database.json
            android_database.json

  build_linux:
    runs-on: ubuntu-latest
    needs: [sort_json]
    permissions: write-all
    name: Build Linux
    steps:
      - uses: actions/checkout@v4
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Install ALSA dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev
      - name: Build linux
        run: cargo +nightly build --release -p desktop
      - name: List files for debugging
        run: ls -la target/release/
      - name: Move linux binaries
        run: |
          mv target/release/desktop Cross_Cleaner_GUI_Linux
      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-binaries
          path: |
            Cross_Cleaner_GUI_Linux

  build_windows:
    runs-on: windows-latest
    needs: [sort_json]
    permissions: write-all
    name: Build Windows
    steps:
      - uses: actions/checkout@v4
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Build windows
        run: cargo +nightly build --release -p desktop
      - name: List files for debugging
        run: dir target\release\
      - name: Move windows binaries
        run: |
          move target\release\desktop.exe Cross_Cleaner_GUI_Windows.exe
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: |
            Cross_Cleaner_GUI_Windows.exe
  build_macos:
    runs-on: macos-latest
    needs: [sort_json]
    permissions: write-all
    name: Build MacOS
    steps:
      - uses: actions/checkout@v4
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Build macos
        run: cargo +nightly build --release -p desktop
      - name: List files for debugging
        run: ls -la target/release/
      - name: Move macos binaries
        run: |
          mv target/release/desktop Cross_Cleaner_GUI_MacOS
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-binaries
          path: |
            Cross_Cleaner_GUI_MacOS
  build_android:
    runs-on: ubuntu-latest
    needs: [sort_json]
    permissions: write-all
    name: Build Android
    steps:
      - uses: actions/checkout@v4
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Install cargo-apk2
        run: cargo install cargo-apk2 --locked
      - name: Install Android targets
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android i686-linux-android
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973"
      - name: Check android target
        run: cargo check -p android --target aarch64-linux-android
      - name: Build APK debug (cargo apk2)
        env:
          ANDROID_NDK_ROOT: /usr/local/lib/android/sdk/ndk/27.0.12077973
        run: |
          cargo apk2 build -p android
          APK=$(find target -type f -name "*.apk" | head -n 1)
          echo "APK: $APK"
          ls -lh "$APK" || true
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-debug
          if-no-files-found: warn
          path: |
            target/**/*.apk
