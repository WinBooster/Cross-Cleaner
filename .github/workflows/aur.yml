name: Update AUR packages

# Publishes a tagged release to the AUR as two packages, both pinned to the
# same tag:
#
#   cross-cleaner      compiles the release on the machine that installs it
#   cross-cleaner-bin  installs the `-no-updater` binaries the release uploaded
#
# The version is an input rather than something read from the default branch:
# each PKGBUILD names exactly one git tag, so which release goes out is always
# an explicit choice and never whatever main happened to contain.
#
# Neither PKGBUILD is edited here by hand. packaging/aur/PKGBUILD and
# packaging/aur/bin/PKGBUILD in this repository are the single source of truth,
# and each job copies its own into its AUR repository with only the block
# between the AUR-VERSION markers rewritten -- the version, the pkgrel and the
# checksums. What is committed inside those markers is whatever the last edit
# of the template left there and not what the AUR carries; publishing rewrites
# it. The input validation, the tag lookup, the checksummed tag archive and the
# SSH setup are shared through .github/actions/aur-prepare, and the .SRCINFO
# regeneration and the push through .github/actions/aur-publish.
#
# pkgrel and target exist for the one case a release does not cover: a fix to a
# PKGBUILD for a version that is already on the AUR. The fixed PKGBUILD is the
# same pkgver with the next pkgrel, and only the package that changed needs to
# be republished, so neither field can be fixed at 1/both.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, as a git tag without the leading v (e.g. 2.0.4.2.5)"
        required: true
        default: "2.0.4.2.5"
      pkgrel:
        description: "pkgrel to publish: 1 for a new version, higher when republishing a packaging fix"
        required: false
        default: "1"
      target:
        description: "Which package to publish"
        type: choice
        options:
          - both
          - cross-cleaner
          - cross-cleaner-bin
        required: false
        default: "both"
      dry_run:
        description: "Check everything and show the diff, but do not push to AUR"
        type: boolean
        required: false
        default: false

env:
  CARGO_TERM_COLOR: always

jobs:
  update-aur:
    # `target` selects one job or both: a republish of a packaging fix touches
    # exactly one package, and publishing the other one again would only raise
    # a pkgrel nobody changed anything in.
    if: ${{ inputs.target != 'cross-cleaner-bin' }}
    runs-on: ubuntu-latest
    name: Update cross-cleaner in AUR
    # The AUR write key lives in this repository's `secrets` environment, next
    # to WINGET_TOKEN and VT_API_KEY. Declaring it explicitly is what makes those
    # visible to this job; the environment is not set as the repository default,
    # so without this line `secrets.AUR_SSH_PRIVATE_KEY` resolves to empty.
    environment: secrets
    env:
      APP_VERSION: ${{ github.event.inputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Only the PKGBUILD template is needed. Depth 1 with no history saves
          # a large clone: the tag list is fetched separately by the action.
          fetch-depth: 1

      - name: Prepare the publication
        id: prepare
        uses: ./.github/actions/aur-prepare
        with:
          version: ${{ github.event.inputs.version }}
          pkgrel: ${{ inputs.pkgrel }}
          ssh-key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          aur-repo: ssh://aur@aur.archlinux.org/cross-cleaner.git
          checkout-dir: aur-pkg

      - name: Copy the packaging files into the AUR repository
        run: |
          set -euo pipefail
          cd aur-pkg
          cp ../packaging/aur/PKGBUILD PKGBUILD
          cp ../packaging/aur/LICENSE LICENSE
          cp ../packaging/aur/.gitignore .gitignore

      - name: Pin the PKGBUILD to the requested version
        env:
          # Passed in rather than exported by the action: an environment
          # variable written inside a composite action is not visible to the
          # steps of that same action, which makes the export work in some job
          # shapes and silently produce an empty string in others.
          SHA256: ${{ steps.prepare.outputs.sha256 }}
          PKGREL: ${{ inputs.pkgrel }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, sys

          begin = "# ---AUR-VERSION-BEGIN---"
          end = "# ---AUR-VERSION-END---"
          version = os.environ["APP_VERSION"]
          pkgrel = os.environ["PKGREL"]
          sha = os.environ["SHA256"]
          path = "aur-pkg/PKGBUILD"

          lines = open(path).read().splitlines()
          try:
              first = lines.index(begin)
              last = lines.index(end)
          except ValueError:
              sys.exit(f"::error::markers not found in {path}")
          if last < first:
              sys.exit("::error::markers are in the wrong order")

          block = [
              begin,
              f"pkgver={version}",
              # Passed in rather than derived: a new version starts at pkgrel 1,
              # but a fix to the PKGBUILD for a version the AUR already carries
              # is published as the same pkgver with a higher pkgrel, and only
              # the caller knows which of the two this run is.
              f"pkgrel={pkgrel}",
              'source=("cross-cleaner-v${pkgver}.tar.gz::'
              'https://github.com/Cross-Cleaner/Cross-Cleaner/archive/refs/tags/v${pkgver}.tar.gz")',
              f"sha256sums=('{sha}')",
              end,
          ]
          open(path, "w").write("\n".join(lines[:first] + block + lines[last + 1:]) + "\n")
          print(f"PKGBUILD pinned to {version}-{pkgrel}")
          PY

      - name: Regenerate .SRCINFO and push
        uses: ./.github/actions/aur-publish
        with:
          checkout-dir: aur-pkg
          version: ${{ github.event.inputs.version }}
          pkgrel: ${{ inputs.pkgrel }}
          package: cross-cleaner
          # One source, so one checksum: the tag archive. See the action for
          # what the numbers are compared against.
          checksums: sha256sums=1
          dry-run: ${{ inputs.dry_run }}

  update-aur-bin:
    if: ${{ inputs.target != 'cross-cleaner' }}
    runs-on: ubuntu-latest
    name: Update cross-cleaner-bin in AUR
    environment: secrets
    env:
      APP_VERSION: ${{ github.event.inputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Prepare the publication
        id: prepare
        uses: ./.github/actions/aur-prepare
        with:
          version: ${{ github.event.inputs.version }}
          pkgrel: ${{ inputs.pkgrel }}
          ssh-key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          aur-repo: ssh://aur@aur.archlinux.org/cross-cleaner-bin.git
          checkout-dir: aur-bin

      - name: Download the release assets
        # Both architectures, not just the one this runner is: the PKGBUILD has
        # to carry a checksum for every architecture it declares in arch=,
        # because the user builds on whichever machine they have and nothing
        # runs later to fill in the other one.
        run: |
          set -euo pipefail
          mkdir -p release-assets
          for prefix in Linux Linux-Arm64; do
            for component in GUI TUI CLI; do
              asset="${prefix}-Cross_Cleaner_${component}-no-updater"
              # --fail so a missing upload is an error rather than a saved
              # error page: without it, an asset that failed to publish would
              # be hashed and pushed as if it were a binary.
              curl -sSfL --retry 3 -o "release-assets/${asset}" \
                "https://github.com/${GITHUB_REPOSITORY}/releases/download/v${APP_VERSION}/${asset}"
              printf '  %s %s\n' "${asset}" "$(sha256sum "release-assets/${asset}" | cut -d' ' -f1)"
            done
          done

      - name: Verify the assets are no-updater Linux builds
        # The two properties this package exists for, asserted here rather than
        # discovered by whoever installs it later:
        #
        # 1. the architecture, because a URL that lost its `Arm64` marker
        #    resolves happily and installs a binary the machine cannot run;
        # 2. the feature set, because a self-updating build would replace its
        #    own file behind pacman's back. This is the same canary the release
        #    pipeline applies to the .deb it builds from this same code, and
        #    finding `selfupdate` in the binary is the failure.
        run: |
          set -euo pipefail
          for spec in "Linux:x86-64" "Linux-Arm64:aarch64"; do
            prefix="${spec%%:*}"
            marker="${spec##*:}"
            for component in GUI TUI CLI; do
              asset="release-assets/${prefix}-Cross_Cleaner_${component}-no-updater"
              # -L because the same check in the PKGBUILD reads a symlink:
              # makepkg lays a source into $srcdir as a link to the download
              # rather than copying it, and file(1) does not follow symlinks
              # unless asked. The two checks have to mean the same thing.
              desc=$(file -Lb "$asset")
              printf '%s: %s\n' "$asset" "$desc"
              if ! printf '%s' "$desc" | grep -qF "$marker"; then
                echo "::error::${asset} is not a ${marker} binary"
                exit 1
              fi
              # Matching lines are printed rather than merely counted, so a
              # false positive names itself instead of looking like a broken
              # release.
              if strings "$asset" | grep -i 'selfupdate' > selfupdate-canary.txt; then
                echo "::error::${asset} carries self-update code:"
                cat selfupdate-canary.txt
                exit 1
              fi
            done
          done

      - name: Copy the packaging files into the AUR repository
        run: |
          set -euo pipefail
          cd aur-bin
          cp ../packaging/aur/bin/PKGBUILD PKGBUILD
          # Shared with cross-cleaner: the same 0BSD license on the packaging
          # files, and the same list of makepkg's build artifacts to ignore.
          cp ../packaging/aur/LICENSE LICENSE
          cp ../packaging/aur/.gitignore .gitignore

      - name: Pin the PKGBUILD to the requested version
        # The checksums are computed from the files themselves, both here and
        # for the tag archive: they are the files that were just downloaded and
        # verified, so nothing can be hashed that was not also inspected.
        env:
          PKGREL: ${{ inputs.pkgrel }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, os, sys

          begin = "# ---AUR-VERSION-BEGIN---"
          end = "# ---AUR-VERSION-END---"
          version = os.environ["APP_VERSION"]
          pkgrel = os.environ["PKGREL"]
          path = "aur-bin/PKGBUILD"
          assets = "release-assets"
          repo = "https://github.com/Cross-Cleaner/Cross-Cleaner"

          def sha256(filename):
              digest = hashlib.sha256()
              with open(filename, "rb") as handle:
                  for chunk in iter(lambda: handle.read(1 << 20), b""):
                      digest.update(chunk)
              return digest.hexdigest()

          def upload(prefix, component):
              # The `-no-updater` suffix is not decoration: it names the build
              # whose self-update feature was compiled out, which is the whole
              # reason this package exists next to the default asset.
              return "%s-Cross_Cleaner_%s-no-updater" % (prefix, component)

          archive = "cross-cleaner-v%s.tar.gz" % version
          archive_sha = sha256(archive)
          sums = []

          block = [
              begin,
              "pkgver=%s" % version,
              # Passed in rather than derived: a new version starts at pkgrel 1,
              # but a fix to the PKGBUILD for a version the AUR already carries
              # is published as the same pkgver with a higher pkgrel, and only
              # the caller knows which of the two this run is.
              "pkgrel=%s" % pkgrel,
          ]

          for arch, prefix in (("x86_64", "Linux"), ("aarch64", "Linux-Arm64")):
              names = [upload(prefix, component) for component in ("GUI", "TUI", "CLI")]
              block.append("source_%s=(" % arch)
              # A literal ${pkgver} on purpose: it is a reference for pacman to
              # expand, not a value to substitute now.
              block.append('    "cross-cleaner-v${pkgver}.tar.gz::'
                           '%s/archive/refs/tags/v${pkgver}.tar.gz"' % repo)
              for name in names:
                  block.append('    "%s/releases/download/v${pkgver}/%s"' % (repo, name))
              block.append(")")
              block.append("sha256sums_%s=(" % arch)
              block.append("    '%s'" % archive_sha)
              for name in names:
                  digest = sha256(os.path.join(assets, name))
                  sums.append(digest)
                  block.append("    '%s'" % digest)
              block.append(")")
          block.append(end)

          # Six uploads of three different programs: identical checksums would
          # mean the downloads did not resolve to six different files -- a URL
          # that answered with the same content twice, most likely. The
          # PKGBUILD would carry perfectly plausible-looking checksums either
          # way, so the mistake is caught here instead.
          if len(set(sums)) != len(sums):
              sys.exit("::error::two release assets have the same checksum")

          lines = open(path).read().splitlines()
          try:
              first = lines.index(begin)
              last = lines.index(end)
          except ValueError:
              sys.exit(f"::error::markers not found in {path}")
          if last < first:
              sys.exit("::error::markers are in the wrong order")
          open(path, "w").write("\n".join(lines[:first] + block + lines[last + 1:]) + "\n")
          print("PKGBUILD pinned to %s-%s" % (version, pkgrel))
          PY

      - name: Regenerate .SRCINFO and push
        uses: ./.github/actions/aur-publish
        with:
          checkout-dir: aur-bin
          version: ${{ github.event.inputs.version }}
          pkgrel: ${{ inputs.pkgrel }}
          package: cross-cleaner-bin
          # Four sources per architecture -- the tag archive and the three
          # uploads -- and the archive's checksum appears in both arrays
          # because both architectures share that one file.
          checksums: sha256sums_x86_64=4 sha256sums_aarch64=4
          dry-run: ${{ inputs.dry_run }}
