[package]
name = "updater"
version = "0.1.0"
edition = "2024"
description = "Auto-updater for Cross Cleaner — downloads and launches the Inno Setup installer from GitHub Releases"
license = "MIT"
repository = "https://github.com/WinBooster/Cross-Cleaner"
keywords = ["updater", "inno-setup", "auto-update", "cross-cleaner"]
categories = ["command-line-utilities"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
ureq = { version = "2.10", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
