[package]
name = "winicon"
version = "2.0.4"
edition = "2024"
description = "Shared Windows resource (icon, version, manifest) setup for the Cross Cleaner binaries"

[lib]
name = "winicon"
path = "src/lib.rs"

# `winres` is used by the *consuming* crate's build script, so it is a regular
# dependency here, not a build dependency.
[target.'cfg(windows)'.dependencies]
winres = "0.1.12"