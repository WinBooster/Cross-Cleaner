[package]
name = "appcore"
version = "2.0.4"
edition = "2024"

[lib]
name = "appcore"
path = "src/lib.rs"

[dependencies]
database = { path = "../database" }
cleaner = { path = "../cleaner" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
futures = "0.3"
notify-rust = "4"
tempfile = "3.27"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"