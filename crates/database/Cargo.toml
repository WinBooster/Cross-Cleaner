[package]
name = "database"
version = "2.0.1"
edition = "2024"
build = "build.rs"

[dependencies]
string-interner = "0.20.0"
whoami = "2.1"
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
bitflags = { version = "2.13.2", features = ["serde"] }
disk-name = "1.0.0"
flate2 = "1.1"
ureq = { version = "3.4", features = ["json"] }
tokio = { version = "1", features = ["sync", "macros", "rt-multi-thread"] }

[dev-dependencies]
tempfile = "3.27"

[build-dependencies]
serde_json = "1.0"
flate2 = "1.1"

[target.'cfg(windows)'.dependencies]
winreg = "0.56.0"
