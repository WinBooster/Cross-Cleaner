[package]
name = "Cross_Cleaner_GUI"
version = "1.0.0"
edition = "2024"

[dependencies]
egui = "0.36"
env_logger = "0.11.11"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
futures = "0.3"
notify-rust = "4"
image = { version = "0.25.10", default-features = false, features = ["png", "ico"] }
tempfile = "3.27"
clap = { version = "4.6", features = ["derive"] }
flate2 = "1.1"

database = { path = "../database" }
cleaner = { path = "../cleaner" }

# Performance: Fast memory allocator
mimalloc = "0.1"

[build-dependencies]
flate2 = "1.1"

# Windows: OpenGL (glow) — компактный рендерер.
# Linux: glow + X11/Wayland.
# macOS: Apple deprecated OpenGL, поэтому wgpu (Metal).
[target.'cfg(windows)'.dependencies]
eframe = { version = "0.36", default-features = false, features = [
    "wgpu_no_default_features",
    "default_fonts",
] }
winreg = "0.56.0"

[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.36", default-features = false, features = [
    "glow",
    "default_fonts",
    "x11",
    "wayland",
] }

[target.'cfg(target_os = "macos")'.dependencies]
eframe = { version = "0.36", default-features = false, features = [
    "wgpu_no_default_features",
    "default_fonts",
] }

[target.'cfg(windows)'.build-dependencies]
winres = "0.1.12"

[package.metadata.winres]
FileDescription = "Cross Cleaner"
OriginalFilename = "Cross Cleaner.exe"
LegalCopyright = "Copyright Monolith Development © 2026"
ProductName = "Cross Cleaner"
