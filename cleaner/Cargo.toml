[package]
name = "cleaner"
version = "2.0.3"
edition = "2024"

[dependencies]
cap-std = "4"
glob = "0.3.4"
rayon = "1.12"
futures = "0.3"
tokio = { version = "1", features = ["fs", "rt", "rt-multi-thread", "macros", "sync"] }
database = { path = "../database" }
image = { version = "0.25.10", default-features = false, features = ["png", "ico", "jpeg", "webp", "bmp", "gif"] }
tempfile = "3.27"

[dev-dependencies]
proptest = "1.11"
