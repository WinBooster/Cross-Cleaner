# nfpm configuration for the Cross Cleaner .deb and .rpm.
#
# Rendered by .github/actions/linux-package, which substitutes:
#   %%VERSION%%           2.0.2.5 -> 2.0.2
#   %%RELEASE%%           2.0.2.5 -> 5, giving 2.0.2-5 on dpkg and rpm alike
#   %%DEB_ARCH%%          amd64 or arm64 (dpkg nomenclature, top-level arch)
#   %%RPM_ARCH%%          x86_64 or aarch64 (rpm nomenclature, rpm.arch override)
#   %%MTIME%%             commit timestamp as RFC3339, so the archives are reproducible
#
# One render feeds both packages: dpkg reads the top-level fields and the
# `deb:` section; rpm reads the same top-level fields, its own `rpm:` section
# and `overrides.rpm`, whose `depends` replaces the deb-only spellings of the
# same libraries.
#
# The file layout mirrors the AppImage built by the same action: both ship the
# window app as `cross-cleaner`, the terminal app as `cross-cleaner-tui` and
# the command-line tool as `cross-cleaner-cli`.

name: cross-cleaner
arch: "%%DEB_ARCH%%"
platform: linux
version: "%%VERSION%%"
release: "%%RELEASE%%"
section: utils
priority: optional
maintainer: Cross-Cleaner
vendor: Cross-Cleaner
homepage: https://cross-cleaner.github.io/
license: GPL-3.0-or-later
# Reproducible builds: nfpm stamps every archive entry with this, so two
# builds of the same commit produce the same bytes, on the .deb and the .rpm
# alike. The value must be an RFC3339 timestamp -- nfpm parses this field
# as a time, and passing a raw Unix epoch integer fails with
# `Parsing time ... as 2006-01-02T15:04:05Z07:00`.
mtime: "%%MTIME%%"

description: |
  Cross Cleaner removes temporary files, cache and other system junk.
  .
  It ships as a native window app, a terminal app and a command-line tool, and
  cleanses Windows, macOS, Linux and Android, on x86_64 and arm64 alike. This
  package builds without the self-update feature on purpose: the package
  manager owns the installed version, so the app must not advertise a newer
  release or overwrite its own files.

depends:
  # Rust links these two; glibc 2.34+ folds libm/libpthread/libdl into libc6.
  - libc6
  - libgcc-s1

  # Audio: appcore pulls in rodio, which opens an ALSA output device when the
  # sounds are initialised, so this is a hard dependency rather than a
  # recommendation. libasound2t64 is the Ubuntu 24.04+ name and plain libasound2
  # is the Debian/older-Ubuntu one; dpkg resolves `a | b` to whichever is
  # installable, which is why it is written as an alternative rather than picked.
  - libasound2t64 | libasound2

  # GL and EGL, plus the vendor dispatch underneath them. eframe builds with the
  # glow renderer, and glutin's Wayland backend probes EGL.
  - libgl1
  - libegl1
  - libdrm2

  # X11. IMPORTANT: winit reaches every one of these through x11-dl, which
  # dlopen()s them at runtime. None of them appear in `ldd` output and
  # dpkg-shlibdeps cannot see them either, so they must be listed here by hand.
  # They are still required: without them the window never opens.
  - libx11-6
  - libxcursor1
  - libxrandr2
  - libxi6
  - libxinerama1
  - libxext6
  - libxrender1

  # XKB common, for both the X11 and the Wayland path.
  - libxkbcommon0
  - libxkbcommon-x11-0

  # Wayland. Also dlopen'd, through wayland-backend's dlopen feature, so the
  # same caveat as the X11 set above applies.
  - libwayland-client0
  - libwayland-cursor0
  - libwayland-egl1

# dpkg-shlibdeps is deliberately not used to generate the list above, and NOT
# because the build system differs from a user's desktop. It is skipped because
# it can only see the libraries the binary links, and winit dlopen()s the whole
# X11 and Wayland stack, which is most of what is listed above. Its output would
# look complete and still be missing everything needed to open a window. The
# list is therefore maintained by hand, and the workflow dry-run-installs it
# against apt on every release, so a typo fails the build rather than a user's
# install.

overrides:
  # The rpm `depends` override is the FULL requires list, not a delta on top
  # of the deb list above: nfpm merges overrides with mergo's WithOverride,
  # which REPLACES a non-empty slice rather than unioning it (asserted by
  # nfpm's own TestOverrides). Writing only the names that differ here would
  # still land a package requiring libc6 on Fedora.
  #
  # The names follow the Fedora / RHEL / Oracle Linux family, which is what
  # this .rpm is built for. openSUSE and Arch-style forks spell many of the
  # same libraries differently (mesa-libEGL vs Mesa-libEGL1, suffixed
  # libwayland names), so the dependency honesty of this one metadata blob
  # cannot be universal.
  rpm:
    depends:
      # Rust links these two; glibc folds libm/libpthread/libdl into libc.
      - glibc
      - libgcc

      # Audio: rodio opens an ALSA output device when the sounds are
      # initialised, so this is a hard requirement like on the deb side.
      - alsa-lib

      # GL and EGL, plus the vendor dispatch underneath them. eframe builds
      # with the glow renderer, and glutin's Wayland backend probes EGL.
      - mesa-libGL
      - mesa-libEGL
      - libdrm

      # X11. IMPORTANT: winit reaches every one of these through x11-dl, which
      # dlopen()s them at runtime. None of them appear in `ldd` output and no
      # rpmbuild-time scan sees them either, so they must be listed here by
      # hand. They are still required: without them the window never opens.
      - libX11
      - libXcursor
      - libXrandr
      - libXi
      - libXinerama
      - libXext
      - libXrender

      # XKB common, for both the X11 and the Wayland path.
      - libxkbcommon
      - libxkbcommon-x11-0

      # Wayland. Also dlopen'd, through wayland-backend's dlopen feature, so
      # the same caveat as the X11 set above applies.
      - libwayland-client
      - libwayland-cursor
      - libwayland-egl

# The top-level `recommends` flows into the rpm as a weak dependency too;
# fontconfig exists and is spelt the same on Fedora and EL.

recommends:
  # Theme colours come from fontconfig. The app draws its own fonts, so a bare
  # system without this still runs but looks wrong.
  - fontconfig

contents:
  # Built with --no-default-features, so no shipped binary can rewrite itself.
  - src: target/release/desktop
    dst: /usr/bin/cross-cleaner
    file_info:
      mode: 0755

  - src: target/release/tui
    dst: /usr/bin/cross-cleaner-tui
    file_info:
      mode: 0755

  # The headless CLI front-end, invocable as `cross-cleaner-cli` from any
  # shell and from scripting. Like the other two, it has no desktop entry on
  # purpose: a command that only makes sense with arguments would just break
  # the desktop's application grid.
  - src: target/release/cli
    dst: /usr/bin/cross-cleaner-cli
    file_info:
      mode: 0755

  - src: packaging/linux/cross-cleaner.desktop
    dst: /usr/share/applications/cross-cleaner.desktop

  - src: packaging/linux/cross-cleaner-tui.desktop
    dst: /usr/share/applications/cross-cleaner-tui.desktop

  # Generated from crates/winicon/assets/icon.ico by the workflow. The source is
  # a single 96px frame, so 128 and 256 are upscaled; dropping a >=512px master
  # PNG into the repo is what removes that softness.
  - src: target/pkg/icons/48x48/apps/cross-cleaner.png
    dst: /usr/share/icons/hicolor/48x48/apps/cross-cleaner.png

  - src: target/pkg/icons/96x96/apps/cross-cleaner.png
    dst: /usr/share/icons/hicolor/96x96/apps/cross-cleaner.png

  - src: target/pkg/icons/128x128/apps/cross-cleaner.png
    dst: /usr/share/icons/hicolor/128x128/apps/cross-cleaner.png

  - src: target/pkg/icons/256x256/apps/cross-cleaner.png
    dst: /usr/share/icons/hicolor/256x256/apps/cross-cleaner.png

  # Read by dpkg, rpm and appimagetool, so all three show the
  # same entry in GNOME Software, KDE Discover and the browser.
  - src: target/pkg/cross-cleaner.appdata.xml
    dst: /usr/share/metainfo/cross-cleaner.appdata.xml

# Maintainer scripts. Two things to know about these keys:
#
# 1. Top level `scripts`, not `deb.scripts`. As of nfpm 2.47 `deb.scripts` takes
#    only `rules`/`templates`/`config` (the templated-script feature) and the
#    plain maintainer hooks moved here, spelled out in full rather than as dpkg's
#    postinst/postrm. Putting postinst back under `deb:` fails with
#    "field postinst not found in type nfpm.DebScripts".
# 2. The values are PATHS, not inline script text. nfpm reads the file and copies
#    it into the package as DEBIAN/postinst (or postrm) with mode 0755. Inlining
#    the body fails with "file name too long", because nfpm then tries to open
#    the whole body as a filename.
scripts:
  postinstall: packaging/linux/scripts/postinstall.sh
  postremove: packaging/linux/scripts/postremove.sh

rpm:
  # rpm's own nomenclature, applied INSTEAD of the top-level `arch` above:
  # nfpm would map the deb-style name (amd64 -> x86_64) on its own, but this
  # build knows the exact rpm spelling anyway, so it is substituted directly
  # rather than trusting the mapping table.
  arch: "%%RPM_ARCH%%"

deb:
  # GNU extensions for the compression, so the archive is readable without
  # dpkg-deb having to fall back.
  compression: xz