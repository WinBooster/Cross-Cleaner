[workspace]
resolver = "3"
members = [
    "crates/android",
    "crates/appcore",
    "crates/cleaner",
    "crates/database",
    "crates/desktop",
    "crates/gui",
    "crates/selfupdate",
    "crates/tui",
    # Pulled in as a build dependency by both binaries, so it is compiled anyway.
    # Listed explicitly because it owns the icon and the tests that guard it —
    # as an excluded path dependency those tests would never run.
    "crates/winicon",
]

# wgpu-hal 30.0.1 requires windows 0.62, but the crates.io gpu-allocator 0.28.0
# release resolves to windows 0.61 (pulled in by notify-rust -> tauri-winrt-notification).
# Main branch widens the windows requirement to ">=0.53, <=0.62".
[patch.crates-io]
gpu-allocator = { git = "https://github.com/Traverse-Research/gpu-allocator" }

# Every published binary is a portable file a user downloads and runs in place,
# so size wins over speed: `opt-level = "z"` gives up a little throughput for a
# noticeably smaller executable, and nothing this app does is bound tightly
# enough for that to show. Everything that would otherwise pad the file is off:
# no debug info, no symbols, no unwinder, no incremental state, no rpath.
[profile.release]
lto = true
codegen-units = 1
opt-level = "z"
strip = true
panic = "abort"
debug = false
incremental = false
rpath = false

[profile.dev]
debug = "line-tables-only"

[profile.bench]
inherits = "release"

[profile.release-with-debug]
inherits = "release"
debug = true
