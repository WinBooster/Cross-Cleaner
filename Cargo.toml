[workspace]
resolver = "3"
members = [
    "crates/android",
    "crates/appcore",
    "crates/cleaner",
    "crates/database",
    "crates/desktop",
    "crates/gui",
    "crates/selfupdate",
    "crates/tui",
]

# `winicon` is only ever pulled in as a build dependency of the two Windows
# binaries; keeping it out of the member list stops `cargo build --workspace`
# from producing a library nobody links against.
exclude = ["crates/winicon"]

# wgpu-hal 30.0.1 requires windows 0.62, but the crates.io gpu-allocator 0.28.0
# release resolves to windows 0.61 (pulled in by notify-rust -> tauri-winrt-notification).
# Main branch widens the windows requirement to ">=0.53, <=0.62".
[patch.crates-io]
gpu-allocator = { git = "https://github.com/Traverse-Research/gpu-allocator" }

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true
panic = "abort"
debug = false

[profile.dev]
debug = "line-tables-only"

[profile.bench]
inherits = "release"

[profile.release-with-debug]
inherits = "release"
debug = true
